<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vida Divina — Iniciar sesión</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* login.html -- página pública, único punto de entrada sin sesión (ver
       server/index.js#PUBLIC_PATHS). Reutiliza los tokens de color reales
       de styles.css (--forest/--gold/etc.), nunca una paleta nueva. */
    body.login-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--forest);
      font-family: var(--font-body);
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--white-ish);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 32px 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
    }
    .login-card img { display: block; width: 56px; height: 56px; border-radius: 8px; margin: 0 auto 12px; }
    .login-card h1 { font-family: var(--font-display); font-size: 20px; text-align: center; margin: 0 0 4px; color: var(--soft-black); }
    .login-card p.sub { text-align: center; margin: 0 0 24px; color: var(--olive); font-size: 13px; }
    .login-field { margin-bottom: 14px; }
    .login-field label { display: block; font-size: 12px; margin-bottom: 4px; color: var(--soft-black); }
    .login-field input {
      width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line);
      border-radius: 6px; font-size: 14px; font-family: inherit;
    }
    .login-submit {
      width: 100%; padding: 11px; border: none; border-radius: 6px; background: var(--gold);
      color: var(--soft-black); font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 6px;
    }
    .login-submit:disabled { opacity: 0.6; cursor: default; }
    .login-error {
      display: none; margin-bottom: 14px; padding: 9px 11px; border-radius: 6px;
      background: #fbeaea; color: var(--burgundy); font-size: 13px;
    }
    .login-error.visible { display: block; }
  </style>
</head>
<body class="login-body">
  <form class="login-card" id="login-form" autocomplete="on">
    <img src="/logo.jpg" alt="Vida Divina" />
    <h1>Vida Divina</h1>
    <p class="sub">Panel de operación — acceso restringido</p>
    <div class="login-error" id="login-error"></div>
    <div class="login-field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required />
    </div>
    <div class="login-field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
    </div>
    <button type="submit" class="login-submit" id="login-submit">Entrar</button>
  </form>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const submitBtn = document.getElementById('login-submit');

    // Si ya hay sesión real (cookie válida), no tiene sentido mostrar el
    // formulario -- vuelve directo al Dashboard.
    fetch('/api/auth/session').then((r) => r.json()).then((data) => {
      if (data.authenticated) window.location.href = '/';
    }).catch(() => {});

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      errorBox.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Entrando…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          errorBox.textContent = data.error ?? 'No se pudo iniciar sesión.';
          errorBox.classList.add('visible');
          return;
        }
        window.location.href = '/';
      } catch {
        errorBox.textContent = 'No se pudo conectar con el servidor.';
        errorBox.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
